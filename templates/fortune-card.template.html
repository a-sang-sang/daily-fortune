<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오늘의 띠별 운세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5EC;
    --card:#FFFFFF;
    --ink:#4A3F35;
    --ink-soft:#8A7B6C;
    --coral:#FF9B85;
    --mint:#A9DCC9;
    --butter:#FFD873;
    --line:#EFE4D6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    width:1080px; height:1080px;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 90% 8%, rgba(169,220,201,0.35) 0%, transparent 35%),
      radial-gradient(circle at 6% 92%, rgba(255,155,133,0.25) 0%, transparent 32%);
    font-family:'Gowun Dodum', sans-serif;
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }
  .header{ padding:64px 72px 8px; display:flex; justify-content:space-between; align-items:flex-start; }
  .eyebrow{ font-size:20px; color:var(--ink-soft); letter-spacing:2px; }
  .title{ font-family:'Jua', sans-serif; font-size:56px; margin-top:6px; }
  .title span{ color:var(--coral); }
  .seal{
    width:104px; height:104px; border-radius:50%; background:var(--coral);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; font-family:'Jua', sans-serif;
    box-shadow:0 6px 14px rgba(255,155,133,0.4); transform:rotate(6deg); flex-shrink:0;
  }
  .seal .month{ font-size:15px; opacity:0.9; }
  .seal .day{ font-size:34px; line-height:1; margin-top:2px; }
  .hero{
    margin:18px 72px 0; background:var(--card); border-radius:32px; padding:32px 40px;
    display:flex; align-items:center; gap:28px;
    box-shadow:0 10px 24px rgba(74,63,53,0.06); border:2px solid var(--line);
  }
  .hero-badge{
    width:120px; height:120px; border-radius:50%; background:var(--butter);
    display:flex; align-items:center; justify-content:center; font-size:64px; flex-shrink:0;
  }
  .hero-text .tag{
    display:inline-block; font-family:'Jua', sans-serif; font-size:16px;
    background:var(--coral); color:#fff; padding:4px 14px; border-radius:100px; margin-bottom:8px;
  }
  .hero-text .name{ font-family:'Jua', sans-serif; font-size:34px; margin-bottom:6px; }
  .hero-text .fortune{ font-size:22px; color:var(--ink-soft); line-height:1.5; }
  .grid{ margin:28px 72px 0; display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .item{
    background:var(--card); border-radius:20px; padding:18px 20px;
    display:flex; align-items:center; gap:12px; border:1.5px solid var(--line);
  }
  .item.active{ background:#FFF6EC; border-color:var(--coral); }
  .item .icon{ font-size:30px; width:44px; text-align:center; flex-shrink:0; }
  .item .info .name{ font-size:18px; font-weight:700; margin-bottom:2px; }
  .item .info .text{ font-size:14px; color:var(--ink-soft); line-height:1.35; }
  .footer{
    position:absolute; bottom:36px; left:0; right:0; text-align:center;
    font-size:16px; color:var(--ink-soft); letter-spacing:1px;
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="eyebrow">DAILY FORTUNE</div>
      <div class="title">오늘의 <span>띠별</span> 운세</div>
    </div>
    <div class="seal">
      <div class="month">{{MONTH}}월</div>
      <div class="day">{{DAY}}</div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-badge">{{HERO_ICON}}</div>
    <div class="hero-text">
      <div class="tag">오늘의 주인공</div>
      <div class="name">{{HERO_NAME}}</div>
      <div class="fortune">{{HERO_FORTUNE}}</div>
    </div>
  </div>

  <div class="grid">
    {{GRID_ITEMS}}
  </div>

  <div class="footer">오늘도 좋은 하루 되세요 🌤️</div>
</body>
</html>
